name: Business API quality checks
on:
  pull_request:
    paths:
      - "prototypes/cloudflare-business-api/**"
      - ".github/workflows/business-api-quality.yml"
  push:
    branches: [main]
    paths:
      - "prototypes/cloudflare-business-api/**"
      - ".github/workflows/business-api-quality.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/cloudflare-business-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax and run unit tests
        run: npm test
